name: Rebuild dashboard from tracker

on:
  push:
    branches: [main]
    paths:
      - data/ODI_Tracker_latest.xlsx
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-dashboard-main
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert workbook to dashboard data
        run: |
          python -m pip install --disable-pip-version-check openpyxl==3.1.5
          python scripts/build_dashboard_data.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/source/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard/source
        run: npm ci

      - name: Add map coordinates
        working-directory: dashboard/source
        run: node scripts/build-data.mjs

      - name: Export standalone dashboard
        run: node scripts/export_dashboard_standalone.mjs dashboard/index.html

      - name: Confirm generated outputs changed cleanly
        run: |
          test -s dashboard/index.html
          test -s dashboard/source/data/raw-projects.json
          test -s dashboard/source/app/data/projects.json
          python scripts/verify_dashboard.py
          git diff --check

      - name: Commit generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html dashboard/source/data/raw-projects.json dashboard/source/data/build-report.json dashboard/source/app/data/projects.json
          if git diff --cached --quiet; then
            echo "Dashboard is already current."
          else
            git commit -m "Rebuild dashboard from latest tracker"
            git push
          fi
